name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'BankFakeSwift/**'
      - '.github/workflows/build-ipa.yml'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: BankFakeSwift
        run: xcodegen generate

      - name: Build unsigned app
        working-directory: BankFakeSwift
        run: |
          xcodebuild \
            -project BankFake.xcodeproj \
            -scheme BankFake \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build -quiet

      - name: Package IPA
        working-directory: BankFakeSwift
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/BankFake.app Payload/
          zip -qry BankFake-2.5-unsigned.ipa Payload
          ls -lh BankFake-2.5-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BankFake-2.5-unsigned-ipa
          path: BankFakeSwift/BankFake-2.5-unsigned.ipa
          if-no-files-found: error
