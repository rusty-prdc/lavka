name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'BankFakeSwift/**'
      - '.github/workflows/build-ipa.yml'

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          PICK=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$PICK" ]; then
            echo "::error::Xcode 26 not found on runner"
            ls /Applications | grep -i xcode || true
            exit 1
          fi
          sudo xcode-select -s "$PICK/Contents/Developer"
          xcodebuild -version

      - name: Assert iOS 26 SDK
        run: |
          set -euo pipefail
          xcodebuild -showsdks
          if ! xcodebuild -showsdks | grep -q "iphoneos26"; then
            echo "::error::iOS 26 SDK is required for Liquid Glass"
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: BankFakeSwift
        run: xcodegen generate

      - name: Build unsigned app
        working-directory: BankFakeSwift
        run: |
          xcodebuild \
            -project BankFake.xcodeproj \
            -scheme BankFake \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build -quiet

      - name: Package IPA
        working-directory: BankFakeSwift
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/BankFake.app Payload/
          zip -qry BankFake-2.5-unsigned.ipa Payload
          ls -lh BankFake-2.5-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BankFake-2.5-unsigned-ipa
          path: BankFakeSwift/BankFake-2.5-unsigned.ipa
          if-no-files-found: error
