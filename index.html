            <div>

              <p class="home-name" id="home-name">Гость</p>
            </div>
          </div>
          <button class="home-xid" id="home-xid" type="button" onclick="XID.open()" aria-label="XPRODC ID">X-00000000</button>
        </div>

        <div class="clock-widget">
          <p class="cw-time" id="home-time">9:41</p>

        </div>

        <div class="apps-vp">
          <div class="apps-track" id="apps-track"></div>

        <div class="dots" id="home-dots"></div>

        <div class="dock" id="dock"></div>

      <section class="appview" id="appview">

      </section>
    </div>

    <div class="home-indicator"></div>

    <div class="tutorial hidden" id="tutorial">
      <div class="tut-spot" id="tut-spot"></div>
      <div class="tut-card" id="tut-card">
        <p class="tut-step" id="tut-step">1 / 5</p>
        <p class="tut-title" id="tut-title"></p>
        <p class="tut-text" id="tut-text"></p>
